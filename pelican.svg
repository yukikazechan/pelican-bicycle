<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#70c8ff"/>
      <stop offset="60%" stop-color="#bce6ff"/>
      <stop offset="100%" stop-color="#fff4d0"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="100%" stop-color="#2d3748"/>
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#68d391"/>
      <stop offset="100%" stop-color="#38a169"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fca311"/>
      <stop offset="100%" stop-color="#e85d04"/>
    </linearGradient>
    <linearGradient id="bikeFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06d6a0"/>
      <stop offset="100%" stop-color="#118ab2"/>
    </linearGradient>
    <linearGradient id="featherShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f0f4f8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Filters for soft shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @keyframes pedalRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes wheelSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes bodyBob {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-6px) rotate(-1deg); }
      }
      @keyframes beakBob {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes cloudDrift1 {
        0% { transform: translateX(850px); }
        100% { transform: translateX(-250px); }
      }
      @keyframes cloudDrift2 {
        0% { transform: translateX(900px); }
        100% { transform: translateX(-300px); }
      }
      @keyframes roadMove {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -80; }
      }
      @keyframes windLine {
        0% { transform: translateX(800px); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateX(-200px); opacity: 0; }
      }

      .wheel-spokes {
        animation: wheelSpin 1.2s linear infinite;
        transform-origin: center;
      }
      .pedal-crank {
        animation: pedalRotate 1.2s linear infinite;
        transform-origin: 400px 450px;
      }
      .pelican-rider {
        animation: bodyBob 0.6s ease-in-out infinite;
        transform-origin: 380px 400px;
      }
      .pelican-beak {
        animation: beakBob 0.6s ease-in-out infinite;
        transform-origin: 470px 220px;
      }
      .road-stripe {
        animation: roadMove 0.5s linear infinite;
      }
      .cloud-1 {
        animation: cloudDrift1 28s linear infinite;
      }
      .cloud-2 {
        animation: cloudDrift2 38s linear infinite;
      }
      .wind-1 {
        animation: windLine 2.2s linear infinite;
      }
      .wind-2 {
        animation: windLine 3s linear infinite 0.9s;
      }
      .wind-3 {
        animation: windLine 2.6s linear infinite 1.5s;
      }
    </style>
  </defs>

  <!-- Sky Canvas -->
  <rect width="800" height="480" fill="url(#skyGrad)"/>

  <!-- Sun -->
  <circle cx="680" cy="110" r="50" fill="#ffd166" filter="url(#glow)" opacity="0.9"/>
  <circle cx="680" cy="110" r="62" fill="#ffd166" opacity="0.25"/>

  <!-- Background Clouds -->
  <g class="cloud-1" opacity="0.85">
    <path d="M 0 90 Q 20 60 50 65 Q 80 40 120 55 Q 160 50 180 80 Q 200 90 190 110 Q 180 125 150 125 L 20 125 Q -10 120 0 90 Z" fill="#ffffff"/>
  </g>
  <g class="cloud-2" opacity="0.7">
    <path d="M 0 160 Q 30 135 70 140 Q 105 115 150 130 Q 190 125 210 155 Q 230 165 220 185 L 30 185 Q -10 180 0 160 Z" fill="#ffffff"/>
  </g>

  <!-- Distant Hills & Trees -->
  <path d="M 0 460 Q 180 370 380 430 T 800 420 L 800 480 L 0 480 Z" fill="#9ae6b4" opacity="0.7"/>
  <path d="M 0 470 Q 250 410 500 450 T 800 440 L 800 480 L 0 480 Z" fill="#68d391"/>

  <!-- Road & Grass -->
  <rect y="480" width="800" height="120" fill="url(#roadGrad)"/>
  <rect y="475" width="800" height="10" fill="url(#grassGrad)"/>

  <!-- Road Lane Dash Lines -->
  <line x1="0" y1="540" x2="800" y2="540" stroke="#f6e05e" stroke-width="6" stroke-dasharray="40 40" class="road-stripe"/>

  <!-- Speed / Wind Streaks -->
  <path d="M 0 180 Q 80 180 140 180" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" class="wind-1" opacity="0.7"/>
  <path d="M 0 260 Q 100 260 170 260" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" class="wind-2" opacity="0.7"/>
  <path d="M 0 380 Q 70 380 120 380" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" class="wind-3" opacity="0.7"/>

  <!-- Bicycle Shadow -->
  <ellipse cx="400" cy="515" rx="200" ry="16" fill="#1a202c" opacity="0.35"/>

  <!-- ================= BICYCLE ================= -->
  <g id="bicycle" filter="url(#dropShadow)">
    <!-- Back Wheel (Left) -->
    <g transform="translate(240, 450)">
      <circle cx="0" cy="0" r="62" fill="none" stroke="#2d3748" stroke-width="12"/>
      <circle cx="0" cy="0" r="56" fill="none" stroke="#e2e8f0" stroke-width="4"/>
      <!-- Spokes -->
      <g class="wheel-spokes">
        <line x1="-54" y1="0" x2="54" y2="0" stroke="#cbd5e1" stroke-width="2"/>
        <line x1="0" y1="-54" x2="0" y2="54" stroke="#cbd5e1" stroke-width="2"/>
        <line x1="-38" y1="-38" x2="38" y2="38" stroke="#cbd5e1" stroke-width="2"/>
        <line x1="-38" y1="38" x2="38" y2="-38" stroke="#cbd5e1" stroke-width="2"/>
        <line x1="-50" y1="-20" x2="50" y2="20" stroke="#cbd5e1" stroke-width="2"/>
        <line x1="-20" y1="-50" x2="20" y2="50" stroke="#cbd5e1" stroke-width="2"/>
        <line x1="-50" y1="20" x2="50" y2="-20" stroke="#cbd5e1" stroke-width="2"/>
        <line x1="-20" y1="50" x2="20" y2="-50" stroke="#cbd5e1" stroke-width="2"/>
      </g>
      <circle cx="0" cy="0" r="10" fill="#4a5568"/>
      <circle cx="0" cy="0" r="5" fill="#e2e8f0"/>
    </g>

    <!-- Front Wheel (Right) -->
    <g transform="translate(560, 450)">
      <circle cx="0" cy="0" r="62" fill="none" stroke="#2d3748" stroke-width="12"/>
      <circle cx="0" cy="0" r="56" fill="none" stroke="#e2e8f0" stroke-width="4"/>
      <!-- Spokes -->
      <g class="wheel-spokes">
        <line x1="-54" y1="0" x2="54" y2="0" stroke="#cbd5e1" stroke-width="2"/>
        <line x1="0" y1="-54" x2="0" y2="54" stroke="#cbd5e1" stroke-width="2"/>
        <line x1="-38" y1="-38" x2="38" y2="38" stroke="#cbd5e1" stroke-width="2"/>
        <line x1="-38" y1="38" x2="38" y2="-38" stroke="#cbd5e1" stroke-width="2"/>
        <line x1="-50" y1="-20" x2="50" y2="20" stroke="#cbd5e1" stroke-width="2"/>
        <line x1="-20" y1="-50" x2="20" y2="50" stroke="#cbd5e1" stroke-width="2"/>
        <line x1="-50" y1="20" x2="50" y2="-20" stroke="#cbd5e1" stroke-width="2"/>
        <line x1="-20" y1="50" x2="20" y2="-50" stroke="#cbd5e1" stroke-width="2"/>
      </g>
      <circle cx="0" cy="0" r="10" fill="#4a5568"/>
      <circle cx="0" cy="0" r="5" fill="#e2e8f0"/>
    </g>

    <!-- Mudguards / Fenders -->
    <path d="M 180 435 A 64 64 0 0 1 295 405" fill="none" stroke="#06d6a0" stroke-width="8" stroke-linecap="round"/>
    <path d="M 505 405 A 64 64 0 0 1 620 435" fill="none" stroke="#06d6a0" stroke-width="8" stroke-linecap="round"/>

    <!-- Bike Frame Diamond -->
    <!-- Rear stays -->
    <line x1="240" y1="450" x2="340" y2="355" stroke="url(#bikeFrame)" stroke-width="12" stroke-linecap="round"/>
    <line x1="240" y1="450" x2="400" y2="450" stroke="url(#bikeFrame)" stroke-width="12" stroke-linecap="round"/>
    <!-- Seat tube -->
    <line x1="340" y1="340" x2="400" y2="450" stroke="url(#bikeFrame)" stroke-width="12" stroke-linecap="round"/>
    <!-- Top tube -->
    <line x1="340" y1="355" x2="515" y2="355" stroke="url(#bikeFrame)" stroke-width="12" stroke-linecap="round"/>
    <!-- Down tube -->
    <line x1="400" y1="450" x2="515" y2="355" stroke="url(#bikeFrame)" stroke-width="12" stroke-linecap="round"/>
    <!-- Fork & Stem -->
    <line x1="560" y1="450" x2="510" y2="300" stroke="url(#bikeFrame)" stroke-width="12" stroke-linecap="round"/>

    <!-- Handlebars -->
    <path d="M 510 300 L 490 280 L 460 285" fill="none" stroke="#2d3748" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="458" cy="285" r="7" fill="#e63946"/> <!-- Handlebar Grip -->

    <!-- Bicycle Bell -->
    <circle cx="500" cy="275" r="7" fill="#ffd166"/>
    <path d="M 496 272 L 504 272" stroke="#fff" stroke-width="2"/>

    <!-- Front Basket & Fish -->
    <g transform="translate(525, 295)">
      <!-- Wicker Basket -->
      <path d="M 0 10 L 10 50 L 55 50 L 65 10 Z" fill="#d4a373" stroke="#bc6c25" stroke-width="3" stroke-linejoin="round"/>
      <line x1="12" y1="22" x2="53" y2="22" stroke="#bc6c25" stroke-width="2"/>
      <line x1="15" y1="36" x2="50" y2="36" stroke="#bc6c25" stroke-width="2"/>
      <line x1="20" y1="10" x2="25" y2="50" stroke="#bc6c25" stroke-width="2"/>
      <line x1="35" y1="10" x2="35" y2="50" stroke="#bc6c25" stroke-width="2"/>
      <line x1="50" y1="10" x2="45" y2="50" stroke="#bc6c25" stroke-width="2"/>

      <!-- Peeking Fish in basket -->
      <g transform="translate(25, 5) rotate(-25)">
        <ellipse cx="10" cy="0" rx="14" ry="7" fill="#48cae4"/>
        <polygon points="22,0 30,-6 30,6" fill="#0096c7"/>
        <circle cx="3" cy="-2" r="2.5" fill="#ffffff"/>
        <circle cx="2" cy="-2" r="1.2" fill="#03045e"/>
      </g>
    </g>

    <!-- Saddle / Seat -->
    <path d="M 310 335 C 320 325, 360 325, 375 335 C 380 340, 360 345, 335 345 Z" fill="#8d5b4c"/>

    <!-- Chain & Cog -->
    <circle cx="400" cy="450" r="20" fill="none" stroke="#718096" stroke-width="6"/>
    <circle cx="400" cy="450" r="8" fill="#4a5568"/>

    <!-- Pedal Crank Assembly -->
    <g class="pedal-crank">
      <!-- Crank Arm 1 -->
      <line x1="400" y1="450" x2="400" y2="405" stroke="#a0aec0" stroke-width="8" stroke-linecap="round"/>
      <rect x="388" y="400" width="24" height="8" rx="3" fill="#2d3748"/>

      <!-- Crank Arm 2 (Opposite) -->
      <line x1="400" y1="450" x2="400" y2="495" stroke="#a0aec0" stroke-width="8" stroke-linecap="round"/>
      <rect x="388" y="492" width="24" height="8" rx="3" fill="#2d3748"/>
    </g>
  </g>

  <!-- ================= PELICAN RIDER ================= -->
  <g id="pelican" class="pelican-rider" filter="url(#dropShadow)">
    <!-- Tail Feathers -->
    <path d="M 270 340 C 240 330 230 350 250 365 C 235 375 250 390 280 380 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>

    <!-- Back Leg / Foot pedaling -->
    <g>
      <!-- Upper Leg -->
      <path d="M 350 380 L 380 435" stroke="#f77f00" stroke-width="8" stroke-linecap="round"/>
      <!-- Webbed Foot on Top Pedal -->
      <path d="M 370 435 L 405 435 L 395 443 Z" fill="#f77f00"/>
    </g>

    <!-- Main Pelican Body -->
    <path d="M 290 350 C 270 300, 330 260, 380 270 C 430 280, 440 350, 400 395 C 360 425, 305 400, 290 350 Z" 
          fill="url(#featherShade)" stroke="#cbd5e1" stroke-width="3"/>

    <!-- Pelican Neck & Head -->
    <path d="M 380 280 C 390 230, 430 190, 470 190 C 510 190, 520 230, 490 270 C 460 300, 420 300, 380 280 Z" 
          fill="url(#featherShade)" stroke="#cbd5e1" stroke-width="3"/>

    <!-- Captain's Sailor Hat -->
    <g transform="translate(460, 155) rotate(8)">
      <!-- Hat Base -->
      <ellipse cx="25" cy="22" rx="28" ry="8" fill="#1d3557"/>
      <!-- Hat Crown -->
      <path d="M 5 20 C 5 5, 45 5, 45 20 Z" fill="#f1faee"/>
      <!-- Gold Badge Anchor -->
      <circle cx="25" cy="14" r="5" fill="#ffd166"/>
      <path d="M 25 11 L 25 17 M 22 15 Q 25 18 28 15" stroke="#d4a373" stroke-width="1.5" fill="none"/>
      <!-- Shiny Visor -->
      <path d="M 32 24 C 48 24, 55 30, 52 35 C 40 33, 30 27, 32 24 Z" fill="#111827"/>
    </g>

    <!-- Pelican Eye -->
    <g transform="translate(485, 195)">
      <circle cx="0" cy="0" r="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="2" cy="-1" r="5" fill="#1e293b"/>
      <circle cx="3.5" cy="-2.5" r="1.8" fill="#ffffff"/>
    </g>

    <!-- Pelican Cool Aviator Sunglasses -->
    <g transform="translate(475, 190)">
      <path d="M 0 4 Q 10 -4 26 2 Q 22 16 8 16 Q -2 16 0 4 Z" fill="#1e293b" opacity="0.85"/>
      <path d="M 2 5 Q 10 0 20 5" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.8"/>
      <!-- Bridge -->
      <line x1="-6" y1="2" x2="2" y2="4" stroke="#d4af37" stroke-width="2"/>
    </g>

    <!-- Giant Pelican Beak and Elastic Pouch -->
    <g id="beak-pouch" class="pelican-beak">
      <!-- Upper Beak Bill -->
      <path d="M 495 200 C 530 200, 600 215, 630 230 C 625 235, 540 230, 485 220 Z" 
            fill="url(#beakGrad)" stroke="#e85d04" stroke-width="2"/>
      <!-- Hook at beak tip -->
      <path d="M 630 230 Q 634 235 628 240 Q 624 235 626 230 Z" fill="#d00000"/>

      <!-- Lower Beak Pouch (Big Throat Sac!) -->
      <path d="M 485 220 C 510 230, 580 240, 626 232 C 600 310, 510 320, 465 245 Z" 
            fill="url(#pouchGrad)" opacity="0.92" stroke="#d00000" stroke-width="2"/>

      <!-- Throat Pouch Texture Creases -->
      <path d="M 505 235 Q 525 285 555 250" stroke="#d90429" stroke-width="1.5" fill="none" opacity="0.4"/>
      <path d="M 535 238 Q 555 290 585 248" stroke="#d90429" stroke-width="1.5" fill="none" opacity="0.4"/>
      <path d="M 480 235 Q 495 270 520 255" stroke="#d90429" stroke-width="1.5" fill="none" opacity="0.4"/>

      <!-- A tiny fish tail sticking playfully out of the bill -->
      <g transform="translate(610, 225) rotate(15)">
        <polygon points="0,0 12,-5 12,5" fill="#f72585"/>
        <line x1="4" y1="0" x2="10" y2="0" stroke="#fff" stroke-width="1"/>
      </g>
    </g>

    <!-- Pelican Wing (Steering handlebar) -->
    <g>
      <!-- Main Wing Shape -->
      <path d="M 330 290 C 370 270, 430 290, 465 285 C 455 315, 410 370, 350 370 C 320 370, 310 330, 330 290 Z" 
            fill="url(#featherShade)" stroke="#cbd5e1" stroke-width="2.5"/>
      <!-- Wing Feathers Layer -->
      <path d="M 350 330 C 380 320, 420 310, 455 290 C 440 335, 400 365, 360 365 Z" 
            fill="#e2e8f0" opacity="0.6"/>
      <!-- Wing Tip holding handlebar grip -->
      <path d="M 455 280 C 468 280, 472 292, 460 298 C 452 295, 450 285, 455 280 Z" fill="#cbd5e1"/>
    </g>

    <!-- Scarf blowing in the wind -->
    <g transform="translate(420, 275)">
      <path d="M 0 0 C -20 10, -50 0, -80 15 C -90 18, -85 30, -70 25 C -50 20, -30 25, 0 10 Z" 
            fill="#e63946"/>
      <path d="M -15 2 L -20 15 M -40 2 L -45 20 M -65 10 L -70 24" stroke="#ffffff" stroke-width="3"/>
      <!-- Knot -->
      <circle cx="2" cy="5" r="8" fill="#c1121f"/>
    </g>
  </g>
</svg>